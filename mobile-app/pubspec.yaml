name: field_ticket_mobile
description: 现场问题反馈系统 - 移动端

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # 状态管理
  provider: ^6.1.1

  # 网络请求
  http: ^1.1.2

  # 本地存储
  shared_preferences: ^2.2.2

  # URL启动器（打开企业微信等）
  url_launcher: ^6.2.2

  # 图片选择器
  image_picker: ^1.0.5

  # 文件选择器
  file_picker: ^6.1.1

  # 路径操作
  path: ^1.8.3
  path_provider: ^2.1.1

  # 权限管理
  permission_handler: ^11.1.0

  # 图片缓存
  cached_network_image: ^3.3.0

  # 视频播放器
  video_player: ^2.8.1

  # 日期时间选择
  intl: ^0.18.1

  # 二维码扫描
  qr_code_scanner: ^1.0.1

  # UUID生成
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # 如果需要添加图片等资源，取消下面的注释
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # 如果需要自定义字体，取消下面的注释
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700
